name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy to server
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy-frontend

    env:
      # The frontend service is defined in the backend compose file (shared network).
      # Compose names the image <project>-<service>, i.e. backend-frontend.
      IMAGE: backend-frontend:latest
      COMPOSE_FILE: /opt/aya/backend/docker-compose.yml

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 10\n' >> ~/.ssh/config

      # Build on the runner: the VPS can run out of memory during `ng build`.
      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Ship image & restart
        run: |
          docker save "$IMAGE" | gzip | ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "gunzip | docker load"
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            set -e
            docker compose -f $COMPOSE_FILE up -d --no-build --no-deps frontend
            docker image prune -f
          "
