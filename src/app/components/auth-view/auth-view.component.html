<div class="min-h-screen flex items-center justify-center bg-[#f4f7fb] px-6">
  <div class="w-full max-w-sm bg-white rounded-[2rem] shadow-sm border border-gray-100 p-8">
    <div class="flex items-center gap-2 text-blue-500 justify-center mb-6">
      <svg lucideMic [size]="24"></svg>
      <h1 class="font-bold text-xl text-gray-800 tracking-tight">Prep<span class="text-blue-500">Master</span></h1>
    </div>

    <h2 class="text-lg font-bold text-gray-800 text-center mb-1">
      {{ mode() === 'login' ? 'Welcome back' : 'Create your account' }}
    </h2>
    <p class="text-sm text-gray-400 text-center mb-6">
      {{ mode() === 'login' ? 'Log in to keep your streak going.' : 'Start practicing in under a minute.' }}
    </p>

    <form (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-gray-500 mb-1 block">Email</label>
        <input
          type="email"
          name="email"
          required
          [(ngModel)]="email"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-400 focus:outline-none text-sm"
          placeholder="you@example.com"
        />
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500 mb-1 block">Password</label>
        <input
          type="password"
          name="password"
          required
          minlength="8"
          [(ngModel)]="password"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-400 focus:outline-none text-sm"
          placeholder="At least 8 characters"
        />
      </div>

      @if (errorMessage()) {
        <p class="text-sm text-red-500 font-medium">{{ errorMessage() }}</p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full bg-blue-500 text-white font-semibold py-3 rounded-xl hover:bg-blue-600 active:scale-95 transition-all disabled:opacity-50"
      >
        {{ loading() ? 'Please wait...' : mode() === 'login' ? 'Log in' : 'Sign up' }}
      </button>
    </form>

    <button
      type="button"
      (click)="toggleMode()"
      class="w-full text-center text-sm text-gray-400 mt-5 hover:text-gray-600"
    >
      {{ mode() === 'login' ? "Don't have an account? " : 'Already have an account? ' }}
      <span class="text-blue-500 font-semibold">{{ mode() === 'login' ? 'Sign up' : 'Log in' }}</span>
    </button>
  </div>
</div>
