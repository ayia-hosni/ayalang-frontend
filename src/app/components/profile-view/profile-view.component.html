<div class="animate-in fade-in slide-in-from-bottom-4 duration-500 bg-white md:bg-transparent h-full min-h-[100dvh] md:min-h-full md:p-8">
  <div class="md:bg-white md:rounded-[3rem] md:shadow-sm overflow-hidden md:max-w-4xl md:mx-auto">
    <!-- Profile Header -->
    <div class="bg-gradient-to-r from-blue-400 to-blue-500 pt-16 md:pt-20 pb-12 px-6 text-center text-white rounded-b-[3rem] md:rounded-b-none relative shadow-md">
      <div class="w-24 h-24 md:w-32 md:h-32 mx-auto bg-white rounded-full p-1 shadow-lg mb-4 relative">
        <img
          src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix&backgroundColor=b6e3f4"
          alt="Profile"
          class="w-full h-full rounded-full object-cover bg-blue-50"
        />
        <div class="absolute bottom-0 right-0 md:bottom-2 md:right-2 bg-yellow-400 w-7 h-7 md:w-9 md:h-9 rounded-full border-2 border-white flex items-center justify-center shadow-sm">
          <svg lucideTrophy [size]="16" class="text-white"></svg>
        </div>
      </div>
      <h2 class="text-2xl md:text-3xl font-bold">{{ displayName() }}</h2>
      <p class="text-blue-100 mt-1 md:text-lg font-medium">Interview Ready 🚀</p>
    </div>

    <div class="px-6 md:px-12 -mt-6 md:mt-8 relative z-10 md:pb-12">
      <!-- Stats Row -->
      <div class="flex flex-col sm:flex-row gap-4 mb-8 md:mb-12">
        <div class="flex-1 bg-white rounded-2xl p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] transition-shadow text-center border border-gray-50 flex items-center flex-col justify-center">
          <div class="w-12 h-12 md:w-14 md:h-14 mx-auto bg-yellow-50 text-yellow-500 rounded-full flex items-center justify-center mb-3">
            <svg lucideStar [size]="24" class="fill-current"></svg>
          </div>
          <h3 class="font-bold text-gray-800 text-xl md:text-2xl">{{ totalXP() }}</h3>
          <p class="text-sm text-gray-400 font-medium">XP Points</p>
        </div>
        <div class="flex-1 bg-white rounded-2xl p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] transition-shadow text-center border border-gray-50 flex items-center flex-col justify-center">
          <div class="w-12 h-12 md:w-14 md:h-14 mx-auto bg-pink-50 text-pink-500 rounded-full flex items-center justify-center mb-3">
            <svg lucideFlame [size]="24" class="fill-current"></svg>
          </div>
          <h3 class="font-bold text-gray-800 text-xl md:text-2xl">{{ totalPracticed() }}</h3>
          <p class="text-sm text-gray-400 font-medium">Answers Recorded</p>
        </div>
      </div>

      <!-- Achievements -->
      <h3 class="font-bold text-gray-800 mb-4 px-2 text-lg">Achievements</h3>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        @for (ach of achievements; track ach.name) {
          <div class="bg-gray-50 rounded-2xl p-6 text-center border border-gray-100 flex flex-col items-center hover:bg-gray-100 transition-colors cursor-pointer">
            <div class="text-4xl mb-3">{{ ach.icon }}</div>
            <p class="text-sm font-bold text-gray-600 leading-tight">{{ ach.name }}</p>
          </div>
        }
      </div>

      <button
        type="button"
        (click)="logout.emit()"
        class="w-full mt-8 flex items-center justify-center gap-2 py-3 rounded-2xl text-sm font-semibold text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors"
      >
        <svg lucideLogOut [size]="16"></svg>
        Log out
      </button>
    </div>
  </div>
</div>
