<div class="animate-in fade-in slide-in-from-bottom-4 duration-500 px-6 pt-12 md:pt-10 md:px-0 pb-24 md:pb-8">
  <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-1">Interview Tips</h1>
  <p class="text-gray-400 font-medium mb-8">General guidance to use alongside per-question hints.</p>

  <div class="space-y-6">
    @for (group of groups; track group.title) {
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
        <h2 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
          <span class="w-8 h-8 rounded-full flex items-center justify-center {{ group.color }}">
            <svg lucideLightbulb [size]="16"></svg>
          </span>
          {{ group.title }}
        </h2>
        <ul class="space-y-3">
          @for (tip of group.tips; track tip) {
            <li class="text-sm text-gray-600 pl-4 border-l-2 border-gray-100">{{ tip }}</li>
          }
        </ul>
      </div>
    }
  </div>
</div>
